<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07120f">
  <title>St. Louis Archers Franchise Console</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#07110f; color:#f2ead7; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; }
    .loader { text-align:center; max-width:560px; }
    .mark { font-size:3rem; }
    p { color:#a7bcb3; line-height:1.5; }
    a { color:#ddb964; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="mark">🏹</div>
    <h1>Opening the Archers Console</h1>
    <p id="status">Loading the Phase Three operations, Game Day, roster and Front Office interfaces…</p>
  </div>
  <script>
    (async () => {
      try {
        const response = await fetch("index-phase2.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`Base console returned ${response.status}`);
        let html = await response.text();
        html = html.replace("</head>", '<link rel="stylesheet" href="phase3-gameday.css"><link rel="stylesheet" href="phase3-roster.css?v=20260729-3"><link rel="stylesheet" href="phase3-roster-drawer.css?v=20260729-1"><link rel="stylesheet" href="phase3-front-office.css?v=20260729-1"></head>');
        html = html.replace("</body>", '<script src="phase3-gameday.js"><\/script><script src="phase3-roster.js?v=20260729-3"><\/script><script src="phase3-roster-drawer.js?v=20260729-1"><\/script><script src="phase3-front-office.js?v=20260729-1"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById("status").innerHTML = `The Phase Three loader could not open the base console. <a href="index-phase2.html">Open Phase Two directly</a>.<br><br>${String(error.message || error)}`;
      }
    })();
  </script>
</body>
</html>
