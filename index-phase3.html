<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07120f">
  <title>St. Louis Archers Portal</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#07110f; color:#f2ead7; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 20% 0%,rgba(45,104,82,.24),transparent 38%),#07110f; }
    .loader { text-align:center; max-width:620px; }
    .mark { font-size:3rem; }
    .bar { width:min(360px,78vw); height:7px; margin:20px auto; overflow:hidden; border:1px solid #274a40; border-radius:999px; background:#0d1b18; }
    .bar::after { content:""; display:block; width:42%; height:100%; border-radius:inherit; background:#e0bb62; animation:travel 1.1s ease-in-out infinite alternate; }
    p { color:#a7bcb3; line-height:1.5; }
    a { color:#ddb964; }
    @keyframes travel { from { transform:translateX(-25%); } to { transform:translateX(165%); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="mark">🏹</div>
    <h1>Opening the Archers Portal</h1>
    <div class="bar" aria-hidden="true"></div>
    <p id="status">Connecting the Decision Queue, roster, contracts, calendar and franchise operations…</p>
  </div>
  <script>
    (() => {
      const STYLE_ASSETS = [
        "phase3-gameday.css",
        "phase3-roster.css?v=20260729-3",
        "phase3-roster-drawer.css?v=20260729-1",
        "phase3-front-office.css?v=20260729-1",
        "phase3-draft-capital.css?v=20260729-1",
        "phase3-transaction-center.css?v=20260729-1",
        "phase3-transaction-ledger-v1-adapter.css?v=20260729-1",
        "phase3-trade-center.css?v=20260730-2",
        "phase3-collapsible-sections.css?v=20260729-2",
        "phase3-weekly-ops.css?v=20260729-1",
        "phase3-decision-queue-v1-adapter.css?v=20260730-1",
        "phase4-archers-portal.css?v=20260731-1",
        "phase4-archers-portal-layout.css?v=20260731-1",
        "phase4-squad-planner.css?v=20260731-1",
        "phase4-recruitment-market-desk.css?v=20260731-1",
        "phase4-opponent-package.css?v=20260731-1"
      ];

      const SCRIPT_ASSETS = [
        "archers-app-config.js?v=20260731-2",
        "phase4-archers-portal.js?v=20260731-2",
        "phase4-archers-portal-team-labels.js?v=20260731-1",
        "phase3-gameday.js",
        "phase3-roster.js?v=20260729-3",
        "phase3-roster-drawer.js?v=20260731-2",
        "phase4-squad-planner.js?v=20260731-3",
        "phase4-recruitment-market-desk.js?v=20260731-1",
        "phase3-front-office.js?v=20260729-1",
        "phase3-draft-capital.js?v=20260729-1",
        "phase3-draft-capital-live-adapter.js?v=20260729-1",
        "phase3-transaction-center.js?v=20260729-1",
        "phase3-transaction-ledger-v1-adapter.js?v=20260729-1",
        "phase3-trade-finder-engine.js?v=20260730-2",
        "phase3-trade-center.js?v=20260730-2",
        "phase3-collapsible-sections.js?v=20260730-1",
        "phase3-weekly-ops.js?v=20260729-1",
        "phase4-opponent-package.js?v=20260731-1",
        "phase4-opponent-snapshot-bridge.js?v=20260731-1",
        "phase3-decision-queue-active-loader.js?v=20260730-1",
        "phase3-decision-review-bridge.js?v=20260730-1",
        "phase3-decision-review-pointer-fix.js?v=20260730-2"
      ];

      async function openPortal() {
        const response = await fetch("index-phase2.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`Base console returned ${response.status}`);

        let html = await response.text();
        const styles = STYLE_ASSETS.map((href) => `<link rel="stylesheet" href="${href}">`).join("");
        const scripts = SCRIPT_ASSETS.map((src) => `<script src="${src}"><\/script>`).join("");
        html = html.replace("</head>", `${styles}</head>`);
        html = html.replace("</body>", `${scripts}</body>`);

        document.open();
        document.write(html);
        document.close();
      }

      openPortal().catch((error) => {
        document.getElementById("status").innerHTML = `The Archers Portal could not open the operational console. <a href="index-phase2.html">Open the base console directly</a>.<br><br>${String(error?.message ?? error)}`;
      });
    })();
  </script>
</body>
</html>
