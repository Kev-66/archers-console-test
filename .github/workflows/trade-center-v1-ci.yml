name: Trade Center v1 CI

on:
  push:
    branches:
      - agent/trade-center-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse Trade Center JavaScript
        run: node --check phase3-trade-center.js

      - name: Run Trade Center static validation
        run: node tests/trade-center-v1/static-validation.mjs
