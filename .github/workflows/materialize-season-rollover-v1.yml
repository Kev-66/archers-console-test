name: Materialize Season Rollover v1

on:
  push:
    branches:
      - agent/season-rollover-engine-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/season-rollover-engine-v1
          fetch-depth: 0

      - name: Expand source bundle
        run: |
          cat .season-rollover-v1-payload-* > /tmp/season-rollover-v1.b64
          base64 --decode /tmp/season-rollover-v1.b64 > /tmp/season-rollover-v1.tgz
          echo "303d05463ae2cf81228f836f098ff5e786dd19ba55fba5818c883b3d0c55cb5f  /tmp/season-rollover-v1.tgz" | sha256sum -c -
          tar -xzf /tmp/season-rollover-v1.tgz -C .

      - name: Patch Backend 3.3.0 sources
        run: python tools/materialize-season-rollover-v1.py

      - name: Remove temporary materializer
        run: |
          git rm .github/workflows/materialize-season-rollover-v1.yml
          git rm tools/materialize-season-rollover-v1.py
          git rm .season-rollover-v1-payload-*

      - name: Commit materialized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Backend 3.3.0 rollover sources"
          git push origin HEAD:agent/season-rollover-engine-v1
