name: Backend 3.2.0 CI

on:
  push:
    branches:
      - agent/backend-3.2.0-atomic-decision-update
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap isolated database
        run: psql -f tests/backend-3.2.0/bootstrap.sql

      - name: Apply atomic decision migration
        run: psql -f phase3-2-atomic-decision-update.sql

      - name: Run atomic decision regressions
        run: psql -f tests/backend-3.2.0/atomic-decision-update.sql

      - name: Verify generated Edge sources
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          versioned = Path("archers-franchise-index-v3.2.0.ts").read_bytes()
          canonical = Path("edge-function-archers-franchise.ts").read_bytes()

          assert versioned == canonical, "versioned and canonical Edge sources differ"

          text = versioned.decode("utf-8")
          required = [
              'const BACKEND_VERSION = "3.2.0";',
              '"update_decision",',
              '"ATOMIC_DECISION_UPDATE"',
              '"DECISION_IDENTITY_PRESERVATION"',
              '"archers_update_decision"',
              'expected_state_version is required for update_decision',
          ]
          for token in required:
              assert token in text, token

          print("edge_source_sha256=" + hashlib.sha256(versioned).hexdigest())
          print("edge_source_bytes=" + str(len(versioned)))
          PY

      - name: Parse TypeScript
        run: |
          npm install --no-save typescript@5.9.2
          node - <<'NODE'
          const fs = require("fs");
          const ts = require("typescript");
          const source = fs.readFileSync("archers-franchise-index-v3.2.0.ts", "utf8");
          const result = ts.transpileModule(source, {
            compilerOptions: {
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ESNext,
            },
            reportDiagnostics: true,
          });
          const diagnostics = result.diagnostics || [];
          if (diagnostics.length) {
            for (const diagnostic of diagnostics) {
              console.error(ts.flattenDiagnosticMessageText(diagnostic.messageText, "\n"));
            }
            process.exit(1);
          }
          console.log("TypeScript parser diagnostics: 0");
          NODE

      - name: Verify documentation and knowledge architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          design = Path("BACKEND_3.2.0_ATOMIC_DECISION_UPDATE_DESIGN.md").read_text(encoding="utf-8")
          sql = Path("phase3-2-atomic-decision-update.sql").read_text(encoding="utf-8")
          v34 = Path("DRAFT_A_DYNASTY_COMPACT_INSTRUCTIONS_v3.4.md").read_text(encoding="utf-8")
          kernel = Path("DRAFT_A_DYNASTY_COMPACT_INSTRUCTIONS_v4.0.md").read_text(encoding="utf-8")

          module_names = [
              "DAD_CORE_OPERATIONS_MANUAL.md",
              "DAD_DECISION_QUEUE_PROTOCOL.md",
              "DAD_GAME_DAY_PROTOCOL.md",
              "DAD_LEAGUE_AND_RESOURCE_RULES.md",
              "DAD_SESSION_CLOSEOUT_PROTOCOL.md",
              "DAD_CHARACTER_VOICE_GUIDE.md",
          ]
          modules = {name: Path(name).read_text(encoding="utf-8") for name in module_names}

          statuses = [
              "OPEN",
              "READY_FOR_REVIEW",
              "AWAITING_KEVIN",
              "BLOCKED",
              "DEFERRED",
              "RESOLVED",
              "WITHDRAWN",
              "EXPIRED",
          ]
          for status in statuses:
              assert status in design
              assert f"'{status}'" in sql
              assert f"`{status}`" in modules["DAD_DECISION_QUEUE_PROTOCOL.md"]

          for forbidden in ["PENDING", "CLOSED", "CANCELLED"]:
              assert f"`{forbidden}`" not in design
              assert f"'{forbidden}'" not in sql
              assert f"`{forbidden}`" not in modules["DAD_DECISION_QUEUE_PROTOCOL.md"]

          assert "legacy_open_decisions_synchronized" in design
          assert "v_open_decisions" in sql

          assert v34.startswith("DRAFT A DYNASTY • UNIFIED OPERATIONS • COMPACT INSTRUCTIONS v3.4")
          assert len(v34) <= 8000, len(v34)

          assert kernel.startswith("DRAFT A DYNASTY • OPERATING KERNEL • COMPACT INSTRUCTIONS v4.0")
          assert 4000 <= len(kernel) <= 8000, len(kernel)
          assert "Use only operations and source labels returned by current capabilities" in kernel
          assert "patch_franchise_state, update_decision, upsert_resource" not in kernel
          assert "Kevin Dorey is user-controlled only" in kernel
          assert "target decision_queue/decision-queue and never resend the full queue" in kernel

          for name in module_names:
              assert name in kernel, f"kernel does not route to {name}"
              assert len(modules[name]) < 20000, (name, len(modules[name]))

          decision = modules["DAD_DECISION_QUEUE_PROTOCOL.md"]
          assert "Do not mark a decision resolved before its required external effects are verified" in decision
          assert "resource_type: decision_queue" in decision
          assert "resource_id: decision-queue" in decision

          core = modules["DAD_CORE_OPERATIONS_MANUAL.md"]
          assert "A write is not complete when executeArchersOperation merely returns" in core
          assert "Technical failure may delay synchronization" in core

          game = modules["DAD_GAME_DAY_PROTOCOL.md"]
          assert "Never steer toward an Archers win or loss" in game
          assert "Official score, clock, possession" in game

          league = modules["DAD_LEAGUE_AND_RESOURCE_RULES.md"]
          assert "Standings derive from official FINAL game records" in league
          assert "Archive rather than hard-delete" in league

          closeout = modules["DAD_SESSION_CLOSEOUT_PROTOCOL.md"]
          assert "Record the next playable moment" in closeout
          assert "Closeout is incomplete until verification" in closeout

          voice = modules["DAD_CHARACTER_VOICE_GUIDE.md"]
          assert "AUTHORITATIVE FINAL" in voice
          for person in [
              "Mara Voss",
              "Avery Holt",
              "Petra Lang",
              "Wade Sutter",
              "Darius Bell",
              "Elliot Crane",
              "Dr. Anjali Venkataraman",
              "Celeste Navarro",
          ]:
              assert person in voice

          sizes = {"kernel": len(kernel), **{name: len(text) for name, text in modules.items()}}
          print("knowledge architecture passed; sizes=" + repr(sizes))
          PY
