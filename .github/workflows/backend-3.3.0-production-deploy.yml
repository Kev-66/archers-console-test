name: Deploy Backend 3.3.0 Production

# Production trigger refreshed after repository secrets were configured.

on:
  push:
    branches:
      - main
      - agent/deploy-backend-3.3.0-production

permissions:
  contents: write

concurrency:
  group: archers-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'RUN BACKEND 3.3.0 PRODUCTION DEPLOYMENT' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_REF: oqbylwlkrabxvpdhugrf
      FUNCTION_NAME: archers-franchise
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ARCHERS_ACTION_KEY: ${{ secrets.ARCHERS_ACTION_KEY }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Validate production credentials and source identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'SUPABASE_DB_PASSWORD is missing'; exit 1; }
          test -n "$ARCHERS_ACTION_KEY" || { echo 'ARCHERS_ACTION_KEY is missing'; exit 1; }
          cmp --silent archers-franchise-index-v3.3.0.ts edge-function-archers-franchise.ts
          grep -q 'const BACKEND_VERSION = "3.3.0";' archers-franchise-index-v3.3.0.ts
          grep -q '"rollover_season"' archers-franchise-index-v3.3.0.ts
          grep -q 'create or replace function public.archers_rollover_season' phase3-3-season-rollover-v1.sql

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated deployment workspaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-work backup-work evidence
          mkdir -p deploy-work backup-work evidence

          (
            cd deploy-work
            supabase init --force
            mkdir -p supabase/migrations "supabase/functions/$FUNCTION_NAME"
            cp ../phase3-3-season-rollover-v1.sql supabase/migrations/20260730210000_backend_3_3_0_season_rollover.sql
            cp ../archers-franchise-index-v3.3.0.ts "supabase/functions/$FUNCTION_NAME/index.ts"
            cat >> supabase/config.toml <<'TOML'

          [functions.archers-franchise]
          verify_jwt = false
          TOML
          )

          (
            cd backup-work
            supabase init --force
          )

      - name: Link isolated deployment workspace
        shell: bash
        run: |
          set -euo pipefail
          cd deploy-work
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Back up current public schema and Edge Function
        shell: bash
        run: |
          set -euo pipefail
          (
            cd deploy-work
            supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --schema public --file ../evidence/pre-deploy-public-schema.sql
          )
          (
            cd backup-work
            supabase functions download "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api
          )
          tar -czf evidence/pre-deploy-edge-function.tar.gz -C backup-work "supabase/functions/$FUNCTION_NAME"

      - name: Preview remote migration
        shell: bash
        run: |
          set -euo pipefail
          cd deploy-work
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run --include-all | tee ../evidence/db-push-dry-run.txt

      - name: Apply Season Rollover Engine migration
        shell: bash
        run: |
          set -euo pipefail
          cd deploy-work
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes | tee ../evidence/db-push-result.txt

      - name: Deploy Backend 3.3.0 Edge Function
        id: deploy_edge
        shell: bash
        run: |
          set -euo pipefail
          cd deploy-work
          supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api | tee ../evidence/edge-deploy-result.txt

      - name: Verify capabilities and run live dry run only
        shell: bash
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          project_ref = os.environ["PROJECT_REF"]
          action_key = os.environ["ARCHERS_ACTION_KEY"]
          run_id = os.environ["GITHUB_RUN_ID_VALUE"]
          base = f"https://{project_ref}.supabase.co/functions/v1/archers-franchise"
          headers = {
              "x-archers-key": action_key,
              "Content-Type": "application/json",
          }

          def call(method, query="", payload=None, attempts=8):
              url = base + ("?" + query if query else "")
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              last_error = None
              for attempt in range(attempts):
                  try:
                      request = urllib.request.Request(url, data=body, method=method, headers=headers)
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      if attempt + 1 == attempts:
                          raise
                      time.sleep(min(2 ** attempt, 15))
              raise last_error

          def write(name, value):
              with open(f"evidence/{name}", "w", encoding="utf-8") as handle:
                  json.dump(value, handle, indent=2, sort_keys=True)
                  handle.write("\n")

          capabilities = call("GET", "scope=capabilities")
          write("capabilities.json", capabilities)
          assert capabilities.get("backend_version") == "3.3.0", capabilities
          assert "rollover_season" in capabilities.get("write_operations", []), capabilities
          assert "ATOMIC_SEASON_ROLLOVER" in capabilities.get("write_features", []), capabilities
          assert "CONTRACT_RESOURCE_FINGERPRINT" in capabilities.get("safeguards", []), capabilities

          core_before = call("GET", "scope=core_state")
          events_before = call("GET", "scope=events&limit=1")
          write("core-state-before.json", core_before)
          write("events-before.json", events_before)

          state_version = int(core_before["version"])
          timeline = core_before.get("timeline") if isinstance(core_before.get("timeline"), dict) else {}
          season = timeline.get("season") or core_before.get("current_season") or core_before.get("season")
          season = int(season)
          idempotency_key = f"backend-3.3.0-rollover-dry-run-v1-{run_id}"

          dry_run_request = {
              "operation": "rollover_season",
              "resource_type": "season_rollover",
              "resource_id": "season-rollover",
              "expected_state_version": state_version,
              "idempotency_key": idempotency_key,
              "summary": "Validate Season Rollover Engine v1 without changing canon",
              "source_label": "SYSTEM",
              "dry_run": True,
              "payload": {
                  "from_season": season,
                  "to_season": season + 1,
                  "strict": True,
              },
          }
          write("dry-run-request-redacted.json", dry_run_request)

          dry_run = call("POST", payload=dry_run_request)
          write("dry-run-response.json", dry_run)
          assert dry_run.get("dry_run") is True, dry_run
          assert dry_run.get("operation") == "rollover_season", dry_run
          assert int(dry_run.get("current_state_version")) == state_version, dry_run
          assert int(dry_run.get("proposed_state_version")) == state_version + 1, dry_run
          assert isinstance(dry_run.get("expected_resources"), list), dry_run

          core_after = call("GET", "scope=core_state")
          events_after = call("GET", "scope=events&limit=1")
          audit_check = call(
              "GET",
              "scope=operation_verification&" + urllib.parse.urlencode({
                  "idempotency_key": idempotency_key,
                  "resource_type": "season_rollover",
                  "resource_id": "season-rollover",
                  "event_limit": 3,
              }),
          )
          write("core-state-after.json", core_after)
          write("events-after.json", events_after)
          write("dry-run-operation-verification.json", audit_check)

          assert int(core_after["version"]) == state_version, (core_before, core_after)
          assert events_after == events_before, (events_before, events_after)
          assert audit_check.get("verified") is False, audit_check
          assert "No matching audit operation" in str(audit_check.get("error", "")), audit_check

          summary = {
              "backend_version": capabilities["backend_version"],
              "state_version_before": state_version,
              "state_version_after": int(core_after["version"]),
              "from_season": season,
              "to_season": season + 1,
              "ready_to_execute": dry_run.get("ready_to_execute"),
              "blocker_count": dry_run.get("blocker_count"),
              "warning_count": dry_run.get("warning_count"),
              "processable_contracts": (dry_run.get("contract_set") or {}).get("processable_contracts"),
              "legacy_records_requiring_normalization": (dry_run.get("contract_set") or {}).get("legacy_records_requiring_normalization"),
              "expected_resource_count": len(dry_run.get("expected_resources", [])),
              "audit_row_created": False,
              "canon_event_created": False,
              "real_rollover_executed": False,
          }
          write("deployment-summary.json", summary)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Restore prior Edge Function if post-deploy validation fails
        if: ${{ failure() && steps.deploy_edge.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "backup-work/supabase/functions/$FUNCTION_NAME/index.ts" ]; then
            cd backup-work
            supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          else
            echo 'Prior Edge source backup was not found; automatic restore could not run.'
            exit 1
          fi

      - name: Preserve deployment evidence and backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-3.3.0-production-${{ github.run_id }}
          path: evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Publish non-secret deployment status
        if: always()
        shell: bash
        env:
          DEPLOYMENT_JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "run_id=$DEPLOYMENT_RUN_ID"
            echo "job_status=$DEPLOYMENT_JOB_STATUS"
            echo "source_commit=$GITHUB_SHA"
            if [ -f evidence/deployment-summary.json ]; then
              echo "deployment_summary="
              cat evidence/deployment-summary.json
            else
              echo "deployment_summary=unavailable"
            fi
          } > production-deployment-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B deployment-report origin/main
          git add production-deployment-status.txt
          git commit -m "Record Backend 3.3.0 production deployment status" || true
          git push origin HEAD:main
