name: Harden Season Rollover v1

on:
  push:
    branches:
      - agent/season-rollover-engine-v1

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/season-rollover-engine-v1
          fetch-depth: 0

      - name: Apply fingerprint and scale hardening
        run: python tools/harden-season-rollover-v1.py

      - name: Remove temporary hardener and commit
        run: |
          git rm .github/workflows/harden-season-rollover-v1.yml
          git rm tools/harden-season-rollover-v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden rollover fingerprints and verification scale"
          git push origin HEAD:agent/season-rollover-engine-v1
