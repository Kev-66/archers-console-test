name: Backend 3.3.0 Production Preflight

on:
  push:
    branches:
      - agent/deploy-backend-3.3.0-production
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      HAS_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
      HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
      HAS_ARCHERS_ACTION_KEY: ${{ secrets.ARCHERS_ACTION_KEY != '' }}
      HAS_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID != '' }}
    steps:
      - name: Report deployment credential availability
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          present = {
              "SUPABASE_ACCESS_TOKEN": os.environ["HAS_SUPABASE_ACCESS_TOKEN"] == "true",
              "SUPABASE_DB_PASSWORD": os.environ["HAS_SUPABASE_DB_PASSWORD"] == "true",
              "SUPABASE_DB_URL": os.environ["HAS_SUPABASE_DB_URL"] == "true",
              "ARCHERS_ACTION_KEY": os.environ["HAS_ARCHERS_ACTION_KEY"] == "true",
              "SUPABASE_PROJECT_ID": os.environ["HAS_SUPABASE_PROJECT_ID"] == "true",
          }
          present["SQL_DEPLOY_READY"] = present["SUPABASE_DB_PASSWORD"] or present["SUPABASE_DB_URL"]
          present["EDGE_DEPLOY_READY"] = present["SUPABASE_ACCESS_TOKEN"]
          present["LIVE_DRY_RUN_READY"] = present["ARCHERS_ACTION_KEY"]
          present["FULL_DEPLOYMENT_READY"] = (
              present["SQL_DEPLOY_READY"]
              and present["EDGE_DEPLOY_READY"]
              and present["LIVE_DRY_RUN_READY"]
          )
          print(json.dumps(present, indent=2, sort_keys=True))
          PY
