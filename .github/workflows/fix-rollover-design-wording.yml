name: Align rollover design wording

on:
  push:
    branches:
      - agent/season-rollover-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/season-rollover-engine-v1
          fetch-depth: 0

      - name: Add explicit option boundary heading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("SEASON_ROLLOVER_ENGINE_V1_DESIGN.md")
          text = path.read_text(encoding="utf-8")
          marker = "## No automatic options"
          if marker not in text:
              text += "\n\n## No automatic options\n\nOptions are reported as due or unresolved. The rollover engine never exercises or declines an option.\n"
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit wording alignment
        run: |
          git rm .github/workflows/fix-rollover-design-wording.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify no automatic options boundary"
          git push origin HEAD:agent/season-rollover-engine-v1
