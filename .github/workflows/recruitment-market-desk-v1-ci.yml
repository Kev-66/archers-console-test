name: Recruitment & Market Desk v1 CI

on:
  push:
    branches:
      - agent/recruitment-market-desk-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse Recruitment & Market Desk JavaScript
        run: |
          node --check phase4-recruitment-market-desk.js
          node --check tests/recruitment-market-desk/market-desk-dom-smoke.js
          node --check tests/recruitment-market-desk/market-desk-live-browser.mjs

      - name: Run Recruitment & Market Desk static regressions
        run: python tests/recruitment-market-desk/market-desk-v1-static.py

      - name: Run Recruitment & Market Desk DOM smoke test
        run: |
          npm install --no-save jsdom@24.1.3
          node tests/recruitment-market-desk/market-desk-dom-smoke.js

  live-browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Chromium validation dependencies
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start branch console server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/market-desk-http.log 2>&1 &
          echo $! > /tmp/market-desk-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index-phase3.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/market-desk-http.log
          exit 1

      - name: Run live read-only Recruitment & Market Desk validation
        env:
          MARKET_DESK_BASE_URL: http://127.0.0.1:4173
          MARKET_DESK_EVIDENCE_DIR: market-desk-browser-evidence
        run: node tests/recruitment-market-desk/market-desk-live-browser.mjs

      - name: Upload Recruitment & Market Desk browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-desk-browser-${{ github.run_id }}
          path: market-desk-browser-evidence
          if-no-files-found: warn
          retention-days: 14
