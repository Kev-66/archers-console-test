name: Archers Portal v1 CI

on:
  push:
    branches:
      - agent/archers-portal-app-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse Portal JavaScript
        run: |
          node --check archers-app-config.js
          node --check phase4-archers-portal.js
          node --check phase4-archers-portal-team-labels.js
          node --check tests/portal/portal-dom-smoke.js
          node --check tests/portal/portal-live-browser.mjs
          node --check tests/portal/portal-route-sweep.mjs

      - name: Run Portal static regressions
        run: python tests/portal/portal-v1-static.py

      - name: Run Portal DOM smoke test
        run: |
          npm install --no-save jsdom@24.1.3
          node tests/portal/portal-dom-smoke.js

      - name: Verify base console compatibility anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          base = Path("index-phase2.html").read_text(encoding="utf-8")
          loader = Path("index-phase3.html").read_text(encoding="utf-8")
          portal = Path("phase4-archers-portal.js").read_text(encoding="utf-8")
          labels = Path("phase4-archers-portal-team-labels.js").read_text(encoding="utf-8")

          required_base_ids = [
              "record", "standing", "week", "day", "opponent", "kickoff",
              "version", "updated", "continuation", "decisions",
              "overviewMedical", "kevinLock", "dialogueRule", "constitution",
              "operationsManual", "archivedBible", "checkpoint", "seal",
              "bow", "standard", "term", "cap", "overviewCentral"
          ]
          for item in required_base_ids:
              assert f'getElementById("{item}")' in base or f'id="{item}"' in base, item
              assert f'id="{item}"' in portal, item

          assert 'data-tab="overview"' in portal
          assert 'overviewButton.textContent = "Portal"' in portal
          assert "phase4-archers-portal-layout.css" in loader
          assert "phase4-archers-portal-team-labels.js" in loader
          assert 'from("cff_teams")' in labels
          for forbidden in [".insert(", ".update(", ".delete(", ".upsert(", ".rpc("]:
              assert forbidden not in labels, forbidden
          print("Base-console compatibility and team-label checks passed")
          PY

  live-browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Chromium validation dependencies
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start branch console server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/archers-portal-http.log 2>&1 &
          echo $! > /tmp/archers-portal-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index-phase3.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/archers-portal-http.log
          exit 1

      - name: Run live read-only Portal validation
        env:
          PORTAL_BASE_URL: http://127.0.0.1:4173
          PORTAL_EVIDENCE_DIR: portal-browser-evidence
        run: node tests/portal/portal-live-browser.mjs

      - name: Sweep all operations-room routes
        env:
          PORTAL_BASE_URL: http://127.0.0.1:4173
          PORTAL_EVIDENCE_DIR: portal-browser-evidence
        run: node tests/portal/portal-route-sweep.mjs

      - name: Verify human-readable calendar labels
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          summary = json.loads(Path("portal-browser-evidence/portal-live-summary.json").read_text(encoding="utf-8"))
          calendar = summary["calendarText"]
          internal_code = re.search(r"\b(?:vs|at) [a-z0-9._:-]{2,5}\b", calendar)
          assert internal_code is None, f"Internal team ID remained in calendar: {internal_code.group(0)}"
          route_sweep = json.loads(Path("portal-browser-evidence/portal-route-sweep.json").read_text(encoding="utf-8"))
          assert len(route_sweep["results"]) == 7
          assert route_sweep["blockedWrites"] == []
          print("Portal calendar and operations-room route sweep passed")
          PY

      - name: Upload Portal browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archers-portal-browser-${{ github.run_id }}
          path: portal-browser-evidence
          if-no-files-found: warn
          retention-days: 14
