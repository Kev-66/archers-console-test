openapi: 3.1.0
info:
  title: St. Louis Archers Franchise Operations
  version: 3.1.1
  description: Protected read and write access for the Draft a Dynasty franchise.
servers:
  - url: https://oqbylwlkrabxvpdhugrf.supabase.co/functions/v1
security:
  - ArchersKey: []
paths:
  /archers-franchise:
    get:
      operationId: readArchersFranchise
      summary: Read scoped Archers franchise data
      description: Use core_state for current operations, state_fields for exact paths, and filtered resources for resource bodies. Avoid snapshot unless a complete legacy response is required.
      x-openai-isConsequential: false
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum:
              - snapshot
              - core_state
              - state_fields
              - league
              - game
              - resources
              - resource_index
              - events
              - audit
              - capabilities
            default: core_state
        - name: fields
          in: query
          required: false
          description: Comma-separated state paths for state_fields, maximum 20.
          schema:
            type: string
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: visibility
          in: query
          required: false
          schema:
            type: string
        - name: include_data
          in: query
          required: false
          description: Set false for metadata-only resource reads.
          schema:
            type: boolean
            default: true
        - name: include_items
          in: query
          required: false
          description: Set false for counts-only resource_index responses.
          schema:
            type: boolean
            default: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: season
          in: query
          required: false
          schema:
            type: integer
            default: 2026
        - name: week
          in: query
          required: false
          schema:
            type: integer
        - name: game_id
          in: query
          required: false
          schema:
            type: string
        - name: event_type
          in: query
          required: false
          schema:
            type: string
        - name: after_event_id
          in: query
          required: false
          schema:
            type: integer
        - name: operation
          in: query
          required: false
          schema:
            type: string
        - name: after_operation_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Scoped franchise response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseResponse"
        "400":
          description: Invalid scope or parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: executeArchersOperation
      summary: Execute or dry-run a protected franchise operation
      description: Send payload as a native JSON object. Do not stringify it or use payload_json.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - operation
                - summary
                - source_label
                - idempotency_key
                - dry_run
                - payload
              properties:
                operation:
                  type: string
                resource_type:
                  type:
                    - string
                    - "null"
                resource_id:
                  type:
                    - string
                    - "null"
                expected_version:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                expected_state_version:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                idempotency_key:
                  type: string
                  minLength: 1
                summary:
                  type: string
                  minLength: 1
                source_label:
                  type: string
                  enum:
                    - USER_EXPLICIT
                    - LIVE_SESSION_LOG
                    - CHECKPOINT
                    - CORRECTION
                    - SYSTEM
                exact_kevin_text:
                  type:
                    - string
                    - "null"
                dry_run:
                  type: boolean
                payload:
                  $ref: "#/components/schemas/GenericObject"
      responses:
        "200":
          description: Dry-run or operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version, state or operation conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    GenericObject:
      type: object
      properties: {}
      additionalProperties: true
    FranchiseResponse:
      type: object
      properties:
        id:
          type:
            - string
            - "null"
        version:
          type:
            - integer
            - "null"
        state:
          $ref: "#/components/schemas/GenericObject"
        fields:
          $ref: "#/components/schemas/GenericObject"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/GenericObject"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/GenericObject"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GenericObject"
        pagination:
          $ref: "#/components/schemas/GenericObject"
        backend_version:
          type:
            - string
            - "null"
        read_scopes:
          type: array
          items:
            type: string
        error:
          type:
            - string
            - "null"
      additionalProperties: true
    OperationResponse:
      type: object
      properties:
        dry_run:
          type:
            - boolean
            - "null"
        operation:
          type:
            - string
            - "null"
        resource_type:
          type:
            - string
            - "null"
        resource_id:
          type:
            - string
            - "null"
        expected_version:
          type:
            - integer
            - "null"
        current_state_version:
          type:
            - integer
            - "null"
        state_version:
          type:
            - integer
            - "null"
        payload:
          $ref: "#/components/schemas/GenericObject"
        result:
          $ref: "#/components/schemas/GenericObject"
        error:
          type:
            - string
            - "null"
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type:
            - string
            - "null"
        details:
          type:
            - string
            - "null"
        hint:
          type:
            - string
            - "null"
      additionalProperties: true
  securitySchemes:
    ArchersKey:
      type: apiKey
      in: header
      name: x-archers-key
