openapi: 3.1.0
info:
  title: St. Louis Archers Franchise Console
  version: 1.0.0-phase1
  description: >
    Phase One bridge for reading and updating the canonical St. Louis Archers
    franchise state through a protected Supabase Edge Function.
servers:
  - url: https://oqbylwlkrabxvpdhugrf.supabase.co/functions/v1
components:
  securitySchemes:
    archersActionKey:
      type: apiKey
      in: header
      name: x-archers-key
  schemas:
    CanonEvent:
      type: object
      properties:
        event_id:
          type: integer
        state_version:
          type: integer
        event_type:
          type: string
        summary:
          type: string
        exact_kevin_text:
          type:
            - string
            - "null"
        source_label:
          type: string
        created_at:
          type: string
          format: date-time
    FranchiseState:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
        state:
          type: object
          additionalProperties: true
        source_checkpoint_id:
          type: string
        seal_status:
          type: string
        updated_at:
          type: string
          format: date-time
        recent_events:
          type: array
          items:
            $ref: "#/components/schemas/CanonEvent"
    StatePatchRequest:
      type: object
      additionalProperties: false
      required:
        - event_type
        - summary
        - patch
        - source_label
      properties:
        event_type:
          type: string
          description: Compact machine-friendly category such as decision, roster, medical, scene_closeout, correction, checkpoint, or game.
        summary:
          type: string
          minLength: 1
          description: Concise factual description of what became canon.
        patch:
          type: object
          additionalProperties: true
          description: Minimal nested JSON delta. Never resend or rewrite the entire franchise state.
        exact_kevin_text:
          type:
            - string
            - "null"
          description: Kevin Dorey's exact user-supplied words only. Omit or use null when Kevin did not speak.
        source_label:
          type: string
          enum:
            - USER_EXPLICIT
            - LIVE_SESSION_LOG
            - CHECKPOINT
            - CORRECTION
            - SYSTEM
security:
  - archersActionKey: []
paths:
  /archers-franchise:
    get:
      operationId: getArchersFranchiseState
      summary: Read the current canonical Archers franchise state
      description: >
        Read Phase One session state, exact continuation point, injuries, open
        decisions, roster/elevation status, canon guardrails, and recent events.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Current franchise state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FranchiseState"
    post:
      operationId: applyArchersFranchiseUpdate
      summary: Save one bundled canonical Archers update
      description: >
        Apply a minimal state patch and append an event to the canon ledger.
        Bundle related changes from one completed scene or drive into one call.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatePatchRequest"
      responses:
        "200":
          description: Updated franchise state version
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: integer
                  state:
                    type: object
                    additionalProperties: true
                  updated_at:
                    type: string
                    format: date-time
                  event_id:
                    type: integer
